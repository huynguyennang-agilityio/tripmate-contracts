# Contracts CI (EPIC-11 spec, section 2.9). Each job is one required check on `main`;
# the job `name` is the check's name, so keep the names stable.
# `breaking-change` (pull requests) and `tag` (pushes to `main`) are the contract pipeline of
# section 2.10, card CT2.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  translations:
    name: translations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install oasdiff
        # The CT2 tests run oasdiff; the script sets OASDIFF for the next steps.
        run: scripts/install-oasdiff.sh "$RUNNER_TEMP/oasdiff"
      - name: Tests of the checks
        run: npm test
      - name: Translation check
        run: node scripts/check-translations.js
  breaking-change:
    name: breaking-change
    # Pull requests only; on a push this job is skipped.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check reads openapi.json at the last release tag and the latest draft.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install oasdiff
        run: scripts/install-oasdiff.sh "$RUNNER_TEMP/oasdiff"
      - name: Breaking-change check
        run: node scripts/check-breaking.js

  tag:
    name: tag
    # Pushes to `main` only. Not a required check: it tags the merge, it does not judge it.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # One run at a time, so two merges never compute the same tag. A waiting run is never
    # cancelled by a newer one; GitHub keeps at most one waiting run, and the next run works out
    # the tag from the last tag, so a merge whose run was replaced is still tagged then.
    concurrency:
      group: contract-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The token pushes the tag below; it is the only step that uses it.
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Tag the merge
        run: |
          tag="$(node scripts/contract-version.js)"
          if [ -z "$tag" ]; then
            echo "No tag: this merge changes none of openapi.json, events.schema.json, translations/."
            exit 0
          fi
          echo "Tagging $GITHUB_SHA as $tag"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
